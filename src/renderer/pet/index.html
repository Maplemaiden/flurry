<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluffy Pet</title>
  </head>
  <body>
    <div id="app">
      <div id="menu-backdrop" class="menu-backdrop" hidden></div>

      <div id="quick-menu" class="quick-menu" hidden>
        <p class="quick-menu__title">Flurry</p>
        <button type="button" data-menu="home">打开温暖小窝</button>
        <button type="button" data-menu="pet">摸摸我</button>
        <button type="button" data-menu="mute" id="menu-mute">静音</button>
        <button type="button" data-menu="close">收起</button>
      </div>

      <div id="pet" class="pet" title="单击打开菜单 · 拖拽移动" role="img" aria-label="桌面猫咪">
        <div class="pet__body"></div>
        <div class="pet__ear pet__ear--left"></div>
        <div class="pet__ear pet__ear--right"></div>
        <div class="pet__face">
          <span class="pet__eye"></span>
          <span class="pet__eye"></span>
        </div>
      </div>
      <p id="bubble" class="bubble" hidden></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
