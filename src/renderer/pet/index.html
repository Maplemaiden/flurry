<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      html, body, #app {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
        background-color: transparent !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="menu-backdrop" class="menu-backdrop" hidden></div>

      <div class="menu-wrap" id="menu-wrap">
        <div id="quick-menu" class="quick-menu" hidden>
          <button type="button" data-menu="home">小窝</button>
          <button type="button" data-menu="interact">互动</button>
          <button type="button" data-menu="mute" id="menu-mute">静音</button>
        </div>

        <div id="interact-menu" class="interact-menu" hidden>
          <button type="button" data-interact="study">学习</button>
          <button type="button" data-interact="feed">喂养</button>
          <button type="button" data-interact="play">游戏</button>
          <button type="button" data-interact="groom">梳毛</button>
          <button type="button" data-interact="sleep">睡觉</button>
        </div>
      </div>

      <div id="pet" class="pet" title="双击打开菜单 · 拖动头部抚摸 · 拖动身体移动" role="img" aria-label="桌面猫咪">
        <img class="pet__shadow" alt="" draggable="false" />
        <img id="pet-sprite" class="pet__sprite" alt="猫" draggable="false" />
        <div class="pet__head-zone" id="pet-head" title="左右拖动抚摸"></div>
      </div>
      <p id="bubble" class="bubble" hidden></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
