<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flurry — 温暖小窝</title>
  </head>
  <body>
    <div id="app" class="home">
      <header class="home__header">
        <div>
          <p class="home__brand">Flurry</p>
          <p class="home__subtitle" id="subtitle">温暖小窝</p>
        </div>
        <div class="home__header-right">
          <p class="home__focus-timer" id="focus-timer" hidden></p>
          <button type="button" class="home__back" id="back-desktop" title="关闭小窝，回到桌面猫咪">
            返回桌面
          </button>
        </div>
      </header>

      <section class="home__stage" id="stage" aria-label="小家场景">
        <div class="stage__prop" id="stage-prop" hidden></div>
        <img class="stage__shadow" id="stage-shadow" alt="" draggable="false" />
        <img class="stage__cat" id="stage-cat" alt="猫" draggable="false" />
        <p class="stage__hint" id="stage-hint">在这里照顾你的小猫</p>
        <p class="stage__unlocks" id="unlocks"></p>
      </section>

      <div class="home__interact" id="interact-popover" hidden>
        <button type="button" data-interact="study">学习</button>
        <button type="button" data-interact="feed">喂养</button>
        <button type="button" data-interact="play">游戏</button>
        <button type="button" data-interact="groom">梳毛</button>
        <button type="button" data-interact="sleep">睡觉</button>
      </div>

      <nav class="home__actions" aria-label="互动">
        <button type="button" data-action="interact" id="interact-btn">互动</button>
        <button type="button" data-action="study" id="focus-btn">学习陪伴</button>
        <button type="button" data-action="talk" id="talk-btn">说说话</button>
        <button type="button" data-action="shop" id="shop-btn">商店</button>
        <button type="button" data-action="backpack" id="backpack-btn">背包</button>
        <button type="button" data-action="settings" id="settings-btn">设置</button>
      </nav>

      <section class="home__settings-panel" id="settings-panel" hidden aria-label="设置">
        <div class="settings-panel__card">
          <header class="settings-panel__header">
            <h2>设置</h2>
            <button type="button" class="settings-panel__close" id="settings-close">关闭</button>
          </header>

          <div class="settings-panel__body">
            <div class="settings-row">
              <span class="settings-row__label">小猫名字</span>
              <div class="settings-row__field settings-row__field--inline">
                <input id="opt-cat-name" type="text" maxlength="12" placeholder="例如：年糕" autocomplete="off" />
                <button type="button" id="opt-cat-name-save">保存</button>
              </div>
            </div>

            <div class="settings-row">
              <label class="settings-row__label" for="opt-opacity">桌宠透明度</label>
              <div class="settings-row__field">
                <input id="opt-opacity" type="range" min="0.3" max="1" step="0.05" />
              </div>
            </div>

            <div class="settings-row">
              <label class="settings-row__label" for="opt-focus-min">专注时长（分）</label>
              <div class="settings-row__field">
                <input id="opt-focus-min" type="number" min="1" max="180" />
              </div>
            </div>

            <div class="settings-row">
              <label class="settings-row__label" for="opt-ambient">环境音</label>
              <div class="settings-row__field">
                <select id="opt-ambient">
                  <option value="rain">雨声</option>
                  <option value="soft-piano">轻柔粉噪</option>
                  <option value="fire">篝火</option>
                  <option value="none">关闭</option>
                </select>
              </div>
            </div>

            <div class="settings-row settings-row--toggle">
              <label class="settings-row__label" for="opt-muted">静音</label>
              <div class="settings-row__field">
                <input id="opt-muted" type="checkbox" />
              </div>
            </div>

            <div class="settings-row settings-row--toggle">
              <label class="settings-row__label" for="opt-clickthrough">点击穿透</label>
              <div class="settings-row__field settings-row__field--hint">
                <input id="opt-clickthrough" type="checkbox" />
                <p class="settings-hint">开启后桌宠不可点；可用 Ctrl+Alt+P 或托盘关闭</p>
              </div>
            </div>

            <div class="settings-dev" id="settings-dev" hidden>
              <h3 class="settings-dev__title">开发者测试</h3>
              <p class="settings-dev__hint">仅 <code>npm run dev:test</code> 启动时可用</p>

              <div class="settings-dev__toggles">
                <label class="settings-dev__check">
                  <input id="test-infinite-coins" type="checkbox" />
                  无限小魚乾
                </label>
                <label class="settings-dev__check">
                  <input id="test-skip-caps" type="checkbox" />
                  跳过每日上限
                </label>
                <label class="settings-dev__check">
                  <input id="test-fast-focus" type="checkbox" />
                  专注 10 秒
                </label>
              </div>

              <div class="settings-dev__actions">
                <button type="button" class="settings-dev__btn" data-test="skip-onboard">跳过领养</button>
                <button type="button" class="settings-dev__btn" data-test="add-coins">+999 币</button>
                <button type="button" class="settings-dev__btn" data-test="fill-backpack">填满背包</button>
                <button type="button" class="settings-dev__btn" data-test="clear-backpack">清空背包</button>
                <button type="button" class="settings-dev__btn" data-test="reset-daily">重置每日上限</button>
                <button type="button" class="settings-dev__btn" data-test="trigger-event" data-payload="celebrate">庆祝</button>
                <button type="button" class="settings-dev__btn" data-test="trigger-event" data-payload="warm-care">暖心</button>
                <button type="button" class="settings-dev__btn" data-test="trigger-event" data-payload="greet">迎接</button>
                <button type="button" class="settings-dev__btn settings-dev__btn--warn" data-test="reset-state">重置存档</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="home__chat" id="chat-bar" hidden aria-label="说说话">
        <div class="chat__prompts">
          <button type="button" class="chat__prompt" data-prompt="今天天气怎么样">今天天气怎么样</button>
          <button type="button" class="chat__prompt" data-prompt="你喜欢我吗">你喜欢我吗</button>
          <button type="button" class="chat__prompt" data-prompt="你喜欢原神吗">你喜欢原神吗</button>
          <button type="button" class="chat__reset" id="chat-reset" title="敬请期待" aria-label="重置">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 4V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z" fill="currentColor"/>
              <path d="M12 20v3l5-5-5-5v3a5 5 0 1 1-5-5h2a7 7 0 1 0 7 8z" fill="currentColor" transform="translate(0 0)"/>
            </svg>
          </button>
        </div>
        <div class="chat__input-row">
          <input id="chat-input" type="text" placeholder="想说什么都可以，我在听。" maxlength="80" />
          <button type="button" id="chat-send">发送</button>
        </div>
      </section>

      <section class="home__onboard" id="onboard" hidden>
        <h1>遇见你的猫</h1>
        <p>给它起个名字，开始一段温柔陪伴。</p>
        <label>
          名字
          <input id="cat-name" type="text" maxlength="12" placeholder="例如：年糕" />
        </label>
        <div class="onboard__actions">
          <button type="button" id="adopt-btn">领养</button>
          <button type="button" class="btn-ghost" id="onboard-later">先回桌面看看</button>
        </div>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
