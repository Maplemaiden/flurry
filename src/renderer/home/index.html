<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flurry — 温暖小窝</title>
  </head>
  <body>
    <div id="app" class="home">
      <header class="home__header">
        <div>
          <p class="home__brand">Flurry</p>
          <p class="home__subtitle" id="subtitle">温暖小窝</p>
        </div>
        <div class="home__header-right">
          <p class="home__focus-timer" id="focus-timer" hidden></p>
          <button type="button" class="home__back" id="back-desktop" title="关闭小窝，回到桌面猫咪">
            返回桌面
          </button>
        </div>
      </header>

      <section class="home__stage" id="stage" aria-label="小家场景">
        <div class="stage__prop" id="stage-prop" hidden></div>
        <div class="stage__cat" id="stage-cat"></div>
        <p class="stage__hint" id="stage-hint">在这里照顾你的小猫</p>
        <p class="stage__unlocks" id="unlocks"></p>
      </section>

      <nav class="home__actions" aria-label="互动">
        <button type="button" data-action="feed">喂养</button>
        <button type="button" data-action="sleep">睡觉</button>
        <button type="button" data-action="study">学习陪伴</button>
        <button type="button" data-action="groom">梳毛</button>
        <button type="button" data-action="focus" id="focus-btn">专注模式</button>
        <button type="button" data-action="talk">说说话</button>
      </nav>

      <section class="home__settings" aria-label="设置">
        <label>
          透明度
          <input id="opt-opacity" type="range" min="0.3" max="1" step="0.05" />
        </label>
        <label>
          专注时长（分）
          <input id="opt-focus-min" type="number" min="1" max="180" />
        </label>
        <label>
          环境音
          <select id="opt-ambient">
            <option value="rain">雨声</option>
            <option value="soft-piano">轻柔</option>
            <option value="fire">篝火</option>
            <option value="none">关闭</option>
          </select>
        </label>
        <label class="check">
          <input id="opt-muted" type="checkbox" />
          静音
        </label>
        <label class="check">
          <input id="opt-clickthrough" type="checkbox" />
          点击穿透（开启后请用托盘进小窝）
        </label>
      </section>

      <section class="home__onboard" id="onboard" hidden>
        <h1>遇见你的猫</h1>
        <p>给它起个名字，开始一段温柔陪伴。</p>
        <label>
          名字
          <input id="cat-name" type="text" maxlength="12" placeholder="例如：年糕" />
        </label>
        <div class="onboard__actions">
          <button type="button" id="adopt-btn">领养</button>
          <button type="button" class="btn-ghost" id="onboard-later">先回桌面看看</button>
        </div>
      </section>

      <section class="home__talk" id="talk-panel" hidden>
        <header class="talk__top">
          <button type="button" class="talk__back" id="talk-close">← 返回小窝</button>
        </header>
        <div class="talk__body">
          <p class="talk__eyebrow">说说话</p>
          <h2 class="talk__heading">想和我说点什么？</h2>
          <div id="talk-reply" class="talk__bubble" role="status">
            想说什么都可以，我在听。
          </div>
        </div>
        <footer class="talk__footer">
          <input id="talk-input" type="text" placeholder="例如：今天好累…" maxlength="80" />
          <button type="button" id="talk-send">发送</button>
        </footer>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
