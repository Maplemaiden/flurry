<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flurry — 温暖小窝</title>
  </head>
  <body>
    <div id="app" class="home">
      <header class="home__header">
        <div>
          <p class="home__brand">Flurry</p>
          <p class="home__subtitle" id="subtitle">温暖小窝</p>
        </div>
        <div class="home__header-right">
          <p class="home__focus-timer" id="focus-timer" hidden></p>
          <button type="button" class="home__back" id="back-desktop" title="关闭小窝，回到桌面猫咪">
            返回桌面
          </button>
        </div>
      </header>

      <section class="home__stage" id="stage" aria-label="小家场景">
        <div class="stage__prop" id="stage-prop" hidden></div>
        <img class="stage__shadow" id="stage-shadow" alt="" draggable="false" />
        <img class="stage__cat" id="stage-cat" alt="猫" draggable="false" />
        <p class="stage__hint" id="stage-hint">在这里照顾你的小猫</p>
        <p class="stage__unlocks" id="unlocks"></p>
      </section>

      <div class="home__interact" id="interact-popover" hidden>
        <button type="button" data-interact="study">学习</button>
        <button type="button" data-interact="feed">喂养</button>
        <button type="button" data-interact="play">游戏</button>
        <button type="button" data-interact="groom">梳毛</button>
        <button type="button" data-interact="sleep">睡觉</button>
      </div>

      <nav class="home__actions" aria-label="互动">
        <button type="button" data-action="interact" id="interact-btn">互动</button>
        <button type="button" data-action="study" id="focus-btn">学习陪伴</button>
        <button type="button" data-action="talk" id="talk-btn">说说话</button>
      </nav>

      <section class="home__settings" aria-label="设置">
        <label>
          透明度
          <input id="opt-opacity" type="range" min="0.3" max="1" step="0.05" />
        </label>
        <label>
          专注时长（分）
          <input id="opt-focus-min" type="number" min="1" max="180" />
        </label>
        <label>
          环境音
          <select id="opt-ambient">
            <option value="rain">雨声</option>
            <option value="soft-piano">轻柔</option>
            <option value="fire">篝火</option>
            <option value="none">关闭</option>
          </select>
        </label>
        <label class="check">
          <input id="opt-muted" type="checkbox" />
          静音
        </label>
        <label class="check">
          <input id="opt-clickthrough" type="checkbox" />
          点击穿透（Ctrl+Alt+P 可紧急唤回）
        </label>
      </section>

      <section class="home__chat" id="chat-bar" hidden aria-label="说说话">
        <div class="chat__prompts">
          <button type="button" class="chat__prompt" data-prompt="今天天气怎么样">今天天气怎么样</button>
          <button type="button" class="chat__prompt" data-prompt="你喜欢我吗">你喜欢我吗</button>
          <button type="button" class="chat__prompt" data-prompt="你喜欢原神吗">你喜欢原神吗</button>
          <button type="button" class="chat__reset" id="chat-reset" title="敬请期待" aria-label="重置">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 4V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z" fill="currentColor"/>
              <path d="M12 20v3l5-5-5-5v3a5 5 0 1 1-5-5h2a7 7 0 1 0 7 8z" fill="currentColor" transform="translate(0 0)"/>
            </svg>
          </button>
        </div>
        <div class="chat__input-row">
          <input id="chat-input" type="text" placeholder="想说什么都可以，我在听。" maxlength="80" />
          <button type="button" id="chat-send">发送</button>
        </div>
      </section>

      <section class="home__onboard" id="onboard" hidden>
        <h1>遇见你的猫</h1>
        <p>给它起个名字，开始一段温柔陪伴。</p>
        <label>
          名字
          <input id="cat-name" type="text" maxlength="12" placeholder="例如：年糕" />
        </label>
        <div class="onboard__actions">
          <button type="button" id="adopt-btn">领养</button>
          <button type="button" class="btn-ghost" id="onboard-later">先回桌面看看</button>
        </div>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
